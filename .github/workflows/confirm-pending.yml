name: Confirm Pending RTC Transfers

# Hourly delivery-stage job: initiated RTC transfers sit in a 24h pending/void
# window, then must be confirmed via POST /pending/confirm. The node bounds each
# call to a batch (Rustchain#6900: default 100, max 500), so a single call no
# longer drains the whole queue. This job therefore LOOPS, passing limit=500 and
# repeating until stale_pending_count == 0. Any inability to measure the queue,
# request failure, zero-progress iteration, or safety-cap exhaustion with stale
# work remaining is a failed delivery run rather than a successful drain.
#
# The 24h void window remains the safety review: void a suspect transfer within
# 24h and this never confirms it.
#
# Runs on the self-hosted rustchain-vps runner: the F2 route hardening restricts
# /pending/ to trusted IPs, so a GitHub-hosted runner gets an nginx 403. The
# self-hosted runner sits on the VPS itself, whose IP is already allow-listed.
on:
  schedule:
    - cron: '23 * * * *'   # hourly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rtc-confirm-pending
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: [self-hosted, rustchain-vps]
    timeout-minutes: 10
    steps:
      - name: Drain all past-void-window pending transfers
        env:
          RTC_VPS_HOST: ${{ secrets.RTC_VPS_HOST }}
          RTC_ADMIN_KEY: ${{ secrets.RTC_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RTC_VPS_HOST" ] || [ -z "$RTC_ADMIN_KEY" ]; then
            echo "::error::RTC_VPS_HOST / RTC_ADMIN_KEY not configured"; exit 1
          fi
          total=0
          last_stale=-1
          # Safety cap: 60 iterations * 500 = up to 30,000 transfers/run.
          for i in $(seq 1 60); do
            code=$(curl -sk -o resp.json -w '%{http_code}' --max-time 60 \
              -X POST "https://${RTC_VPS_HOST}/pending/confirm" \
              -H "X-Admin-Key: ${RTC_ADMIN_KEY}" \
              -H "Content-Type: application/json" -d '{"limit": 500}')
            if [ "$code" != "200" ]; then echo "::error::confirm HTTP $code"; cat resp.json; exit 1; fi
            # Treat queue measurement and counters as part of the delivery
            # contract. Missing/malformed values are not evidence of a drain.
            read confirmed stale < <(python3 - <<'PY'
          import json

          d = json.load(open('resp.json'))
          measured = d.get('overdue_stats_measured')
          confirmed = d.get('confirmed_count')
          stale = d.get('stale_pending_count')

          def nonnegative_int(value):
              return isinstance(value, int) and not isinstance(value, bool) and value >= 0

          # `overdue_stats_measured` is absent on older node builds. A valid
          # stale count remains acceptable during that deploy window, but an
          # explicit false or malformed/missing counters fail closed.
          if measured is False or not nonnegative_int(stale):
              raise SystemExit('stale pending queue is not measurably known')
          if not nonnegative_int(confirmed):
              raise SystemExit('confirmed_count is missing or invalid')
          print(confirmed, stale)
          PY
          )
            last_stale=$stale
            total=$((total + confirmed))
            echo "iter $i: confirmed=$confirmed total=$total stale_remaining=$stale"
            if [ "$stale" -eq 0 ]; then
              echo "queue drained"
              break
            fi
            if [ "$confirmed" -eq 0 ]; then
              echo "::error title=Pending confirmation made no progress::$stale stale pending transfer(s) remain, but this iteration confirmed zero. Refusing a false-green delivery run."
              cat resp.json
              exit 1
            fi
          done
          if [ "$last_stale" -ne 0 ]; then
            echo "::error title=Pending confirmation safety cap exhausted::$last_stale stale pending transfer(s) remain after the maximum 60 confirmation iterations."
            cat resp.json
            exit 1
          fi
          echo "confirmed $total transfer(s) this run; stale backlog is zero"
