[package]
name = "rustchain-agent-economy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for the RIP-302 v2 RustChain Agent Economy API"
license = "MIT"
repository = "https://github.com/Scottcjn/Rustchain"
keywords = ["rustchain", "rip-302", "agents", "sdk"]
categories = ["api-bindings"]

[dependencies]
ed25519-dalek = "2.1"
hex = "0.4"
percent-encoding = "2.3"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
